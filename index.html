<style>
  /* ---------- Tokens: dark-first (bare :root = dark defaults) ---------- */
  :root {
    --ink: #17151c;
    --surface: #211e27;
    --surface-2: #2a2632;
    --surface-3: #332e3c;
    --border: #3a3542;
    --text: #f3eff7;
    --text-muted: #9b93a8;
    --text-faint: #6e6780;
    --accent: #4fa184;
    --accent-strong: #63c39f;
    --accent-ink: #08150f;
    --heavy: #7a9cc6;
    --heavy-ink: #0d1a29;
    --failure: #e06a52;
    --failure-ink: #2a0d06;
    --pump: #d9a94a;
    --pump-ink: #2b1e04;
    --moderate: #8b93a6;
    --moderate-ink: #12161f;
    --shadow: rgba(0,0,0,0.45);

    --font-display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  /* Ironwave is dark-themed only, on purpose — it doesn't switch to a light
     palette when the phone's system theme is light. (A light-mode variant
     used to live here and was removed because it was flipping day/meal
     titles to dark, low-contrast text on devices in light mode.) */

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 800; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- App shell ---------- */
  #app-header {
    position: sticky; top: 0; z-index: 10;
    background: var(--ink);
    border-bottom: 1px solid var(--border);
  }
  #topbar {
    display: flex; align-items: center; gap: 0.75rem;
    padding: calc(env(safe-area-inset-top, 0px) + 0.85rem) 1.1rem 0.85rem;
  }
  .injection-banner {
    display: flex; align-items: center; gap: 0.65rem;
    padding: 0.6rem 1.1rem;
    background: var(--failure-ink);
    border-top: 1px solid var(--failure);
  }
  .injection-banner[hidden] { display: none; }
  .injection-banner-text {
    flex: 1;
    font-size: 0.78rem; font-weight: 600;
    color: var(--failure);
  }
  .injection-banner button {
    background: var(--failure);
    color: var(--failure-ink);
    border: none;
    border-radius: 0.5rem;

    var stalled = isWeightStalled();
    var protein = MACRO_TARGETS.protein;
    var carbs = MACRO_TARGETS.carbs + (stalled ? STALL_MEAL.macros.carbs : 0);
    var fat = MACRO_TARGETS.fat;
    return { protein: protein, carbs: carbs, fat: fat, kcal: protein * 4 + carbs * 4 + fat * 9, stalled: stalled };
  }

  var VOLUME_TARGETS = {

  /* ================= Storage ================= */
  var DB_KEY = 'ironwave_v1';
  var DEFAULT_MESO_START = '2026-08-31';
  function freshInjections() { return { active: false, startTs: null, lastConfirmedSlot: -1, history: [] }; }
  var db = { sessions: {}, mesoStart: DEFAULT_MESO_START, records: {}, nutrition: {}, bodyLog: {}, bloodwork: {}, injections: freshInjections() };
  (function load() {
    try {
      var raw = localStorage.getItem(DB_KEY);
      if (raw) db = JSON.parse(raw);
      if (!db.sessions) db.sessions = {};
      if (!db.mesoStart) db.mesoStart = DEFAULT_MESO_START;
      if (!db.records) db.records = {};
      if (!db.nutrition) db.nutrition = {};
      if (!db.bodyLog) db.bodyLog = {};
      if (!db.bloodwork) db.bloodwork = {};
      if (!db.injections) db.injections = freshInjections();
    } catch (e) { db = { sessions: {}, mesoStart: DEFAULT_MESO_START, records: {}, nutrition: {}, bodyLog: {}, bloodwork: {}, injections: freshInjections() }; }
  })();
  function save() {
    try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) { /* storage unavailable — state stays in memory this visit */ }
  }

  /* ================= Push notifications =================
     Real background push (meal times, pre-workout shake) needs a server to
     actually fire the notification while the app is closed — a static page
     can't schedule anything on its own. workerUrl points at a small
     Cloudflare Worker that holds this device's push subscription and sends
     it at the right clock times; see the deploy guide for how that's set
     up. Until workerUrl is filled in, this section quietly no-ops — the
     rest of the app works exactly the same either way. */
  var PUSH_CONFIG = {
    vapidPublicKey: 'BFksd5GItI3K66eKuQltKrPLt_O_spGcGO-LgpYzi8rqVwRGXkbfoW5O4vCQuOaFSnjVVIPyjDTQ7IwPsHPth1U',
    workerUrl: 'https://ironwave-notify.hoppinaround-ironwave.workers.dev'
  };

  function pushConfigured() {
    return PUSH_CONFIG.workerUrl.indexOf('PASTE_YOUR') === -1;
  }
  function pushSupported() {
    return pushConfigured() && 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification !== 'undefined';
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  var swRegistration = null;
  var pushSubscribed = false;

  if (pushSupported()) {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      swRegistration = reg;
      return reg.pushManager.getSubscription();
    }).then(function (sub) {
      pushSubscribed = !!sub;
      if (screen === 'home') renderHome();
    }).catch(function () { /* service worker unavailable this visit — Enable button will retry */ });
  }

  function enablePush() {
    if (!swRegistration) { showToast('Still loading — try again in a moment'); return; }
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') {
        showToast('Notification permission was not granted');
        return;
      }
      swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(PUSH_CONFIG.vapidPublicKey)
      }).then(function (sub) {
        return fetch(PUSH_CONFIG.workerUrl + '/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub)
        });
      }).then(function () {
        pushSubscribed = true;
        showToast('Meal & workout notifications enabled');
        if (screen === 'home') renderHome();
      }).catch(function () {
        showToast('Could not enable notifications — try again');
      });
    });
  }

  function disablePush() {
    if (!swRegistration) return;
    swRegistration.pushManager.getSubscription().then(function (sub) {
      if (!sub) { pushSubscribed = false; if (screen === 'home') renderHome(); return; }
      fetch(PUSH_CONFIG.workerUrl + '/unsubscribe', { method: 'POST' }).catch(function () { /* best-effort cleanup */ });
      return sub.unsubscribe().then(function () {
        pushSubscribed = false;
        showToast('Notifications turned off');
        if (screen === 'home') renderHome();
      });
    });
  }

  // Tells the Worker "notify me if this is still pending in a minute" —
  // fire-and-forget, since the local rest timer (startRest/tickRest above)
  // already works correctly on its own; this only adds a background push
  // for when the app is fully closed for the whole rest period. Silently
  // does nothing if notifications were never enabled.
  function pushRestSchedule(seconds, label) {
    if (!pushSupported() || !pushSubscribed) return;
    fetch(PUSH_CONFIG.workerUrl + '/schedule-rest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seconds: seconds, label: label || '' })
    }).catch(function () { /* best-effort */ });
  }
  function pushRestCancel() {
    if (!pushSupported() || !pushSubscribed) return;
    fetch(PUSH_CONFIG.workerUrl + '/cancel-rest', { method: 'POST' }).catch(function () { /* best-effort */ });
  }

  /* All-time personal-best weight per exercise. Deliberately kept separate from
     db.sessions so it survives "Clear all data & start new cycle" — the whole
     point is to know what to start at when a mesocycle restarts. Monotonic:
     only ever raised, never lowered automatically. */
  // Returns the new record object when this call actually improved it (so
  // callers can pop a "New PR" toast in the moment), otherwise null.
  function maybeUpdateRecord(exName, weightStr, repsStr, dateISO) {
    var w = parseFloat(weightStr);
    if (isNaN(w) || w <= 0) return null;
    var r = parseInt(repsStr, 10);
    if (isNaN(r)) r = 0;
    var rec = db.records[exName];
    if (!rec || w > rec.weight || (w === rec.weight && r > (rec.reps || 0))) {
      db.records[exName] = { weight: w, reps: r, date: dateISO };
      return db.records[exName];
    }
    return null;
  }

  // Pops the "New PR" toast in the moment, instead of it only showing up
  // silently on the Records tab later.
  function maybePrToast(newRec, exName) {
    if (!newRec) return;
    showToast('New PR — ' + newRec.weight + 'kg x ' + (newRec.reps || 0) + ' on ' + exName);
  }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function dateLabel(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function injectionTimeLabel(ts) {
    return new Date(ts).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function sessionKey(dateISO, dayId) { return dateISO + '__' + dayId; }

  var WEEKDAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var PAIN_TAGS = ['Elbow', 'Shoulder', 'Knee', 'Other'];
  function fmtSec(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  function todayWeekdayName() {
    return WEEKDAY_NAMES[new Date(todayISO() + 'T00:00:00').getDay()];
  }
  function daysBetween(aISO, bISO) {
    var a = new Date(aISO + 'T00:00:00');
    var b = new Date(bISO + 'T00:00:00');
    return Math.round((b - a) / 86400000);
  }

  /* ================= Mesocycle clock =================
     7-week repeating block, anchored to db.mesoStart:
     weeks 1-2 = Cycle 1, weeks 3-4 = Cycle 2, weeks 5-6 = Cycle 3, week 7 = Deload.
     The Week 1 / Week 2 program template alternates every calendar week, continuously,
     starting on db.mesoStart. */
  function getMesoInfo(dateISO) {
    var diff = daysBetween(db.mesoStart, dateISO);
    if (diff < 0) {
      return { started: false, daysUntilStart: -diff };
    }
    var weekIndex = Math.floor(diff / 7);       // 0-based calendar week since start
    var posInMeso = weekIndex % 7;               // 0..6 position within the 7-week meso
    var mesoNumber = Math.floor(weekIndex / 7) + 1;
    // Template alternates within each mesocycle (Week 1 template on odd cycle-weeks,
    // Week 2 on even), keyed off posInMeso rather than weekIndex — the 7-week meso is
    // an odd length, so anchoring to absolute weeks-since-start would flip which
    // template opens each new mesocycle instead of always starting on Week 1.
    var templateWeek = (posInMeso % 2 === 0) ? 1 : 2;
    var isDeload = posInMeso === 6;
    var cycleNumber = isDeload ? null : Math.floor(posInMeso / 2) + 1; // 1, 2, or 3
    var cycleLabel = isDeload
      ? 'Deload week'
      : ('Cycle ' + cycleNumber + ' (Weeks ' + (cycleNumber * 2 - 1) + '-' + (cycleNumber * 2) + ')');
    return {
      started: true,
      dayNumber: diff + 1,
      weekInMeso: posInMeso + 1,
      mesoNumber: mesoNumber,
      templateWeek: templateWeek,
      isDeload: isDeload,
      cycleLabel: cycleLabel
    };
  }

  function getSession(dateISO, dayId) {
    var key = sessionKey(dateISO, dayId);
    if (!db.sessions[key]) {
      db.sessions[key] = {
        date: dateISO,
        dayId: dayId,
        complete: false,
        skipped: false,
        skipReason: '',
        sleepEnergy: '',
        ex: {}
      };
    }
    if (db.sessions[key].skipped === undefined) {
      db.sessions[key].skipped = false;
      db.sessions[key].skipReason = '';
    }
    return db.sessions[key];
  }
  function getExLog(session, exName) {
    if (!session.ex[exName]) session.ex[exName] = { sets: [], note: '', painTags: [] };
    if (!session.ex[exName].painTags) session.ex[exName].painTags = [];
    return session.ex[exName];
  }

  function getNutritionLog(dateISO) {
    if (!db.nutrition[dateISO]) {
      db.nutrition[dateISO] = { meals: {}, protein: '', carbs: '', fat: '' };
    }
    if (!db.nutrition[dateISO].meals) db.nutrition[dateISO].meals = {};
    return db.nutrition[dateISO];
  }

  var BODY_TOTAL_WEEKS = 18;
  var BODY_MEASURE_FIELDS = [
    { key: 'chest', label: 'Chest' },
    { key: 'shoulders', label: 'Shoulders' },
    { key: 'arms', label: 'Arms' },
    { key: 'forearms', label: 'Forearms' },
    { key: 'waist', label: 'Waist' },
    { key: 'neck', label: 'Neck' }
  ];

  function getBodyEntry(week) {
    if (!db.bodyLog[week]) {
      db.bodyLog[week] = { week: week, weight: '', chest: '', shoulders: '', arms: '', forearms: '', waist: '', neck: '' };
    }
    return db.bodyLog[week];
  }

  function hasBodyData(entry) {
    if (!entry) return false;
    return !!(entry.weight || entry.chest || entry.shoulders || entry.arms || entry.forearms || entry.waist || entry.neck);
  }

  // Returns logged week numbers (1-18), most recently reached week first.
  function bodyLogSorted() {
    return Object.keys(db.bodyLog)
      .map(function (k) { return parseInt(k, 10); })
      .filter(function (w) { return hasBodyData(db.bodyLog[w]); })
      .sort(function (a, b) { return b - a; });
  }

  // Defaults the picker to one week past the furthest logged week, per the
  // "each week I advance 1 week and do my weigh-ins" workflow.
  function suggestedBodyWeek() {
    var logged = bodyLogSorted();
    if (!logged.length) return 1;
    return Math.min(logged[0] + 1, BODY_TOTAL_WEEKS);
  }

  function latestBodyEntry() {
    var logged = bodyLogSorted();
    if (!logged.length) return null;
    return {
      week: logged[0],
      entry: db.bodyLog[logged[0]],
      prevWeek: logged[1] || null,
      prevEntry: logged[1] ? db.bodyLog[logged[1]] : null
    };
  }

  // "No gain for 2 weeks": your latest weigh-in vs. the one from 2 logged
  // weeks before it, skipping any week you didn't weigh in so a missed week
  // doesn't throw this off. Needs at least 3 weigh-ins logged before it can
  // trigger at all.
  function isWeightStalled() {
    var withWeight = bodyLogSorted().filter(function (w) { return !!db.bodyLog[w].weight; });
    if (withWeight.length < 3) return false;
    var current = parseFloat(db.bodyLog[withWeight[0]].weight);
    var twoBack = parseFloat(db.bodyLog[withWeight[2]].weight);
    return current <= twoBack;
  }

  /* Global version of the pain-streak check — not tied to today's specific
     open session like exercisePainStreak, so it can run from the Home
     screen. Looks at each exercise's own most-recent logged history and
     counts how many sessions in a row (starting from the latest) carry the
     same pain tag, regardless of whether today happens to be one of them. */
  function activePainStreaks() {
    var byExercise = {};
    Object.keys(db.sessions).forEach(function (k) {
      var s = db.sessions[k];
      Object.keys(s.ex).forEach(function (name) {
        var log = s.ex[name];
        if (!log) return;
        var hasData = (log.sets || []).some(function (st) { return st.w || st.r; }) || (log.painTags || []).length;
        if (!hasData) return;
        if (!byExercise[name]) byExercise[name] = [];
        byExercise[name].push({ date: s.date, painTags: log.painTags || [] });
      });
    });
    var results = [];
    Object.keys(byExercise).forEach(function (name) {
      var history = byExercise[name].sort(function (a, b) { return b.date.localeCompare(a.date); });
      PAIN_TAGS.forEach(function (tag) {
        var streak = 0;
        for (var i = 0; i < history.length; i++) {
          if (history[i].painTags.indexOf(tag) >= 0) streak++; else break;
        }
        if (streak >= 3) results.push({ exercise: name, tag: tag, streak: streak });
      });
    });
    return results;
  }

  /* Escalates past the fixed calendar deload: fires when 2+ exercises have
     an active pain streak, or when 1+ does alongside a weight stall — matches
     the coach skill's "don't wait for the calendar if the body is signaling
     sooner" rule, surfaced proactively on Home instead of only on request. */
  function shouldSuggestEarlyDeload() {
    var streaks = activePainStreaks();
    var stalled = isWeightStalled();
    return {
      suggest: streaks.length >= 2 || (streaks.length >= 1 && stalled),
      streaks: streaks,
      stalled: stalled
    };
  }

  // HTML version, optionally showing growth vs a previous entry (e.g. week 3 vs
  // week 2) as "35cm→39cm +4cm" in a colored badge. Each dynamic value is escaped
  // individually before being assembled — never escape the assembled HTML itself,
  // or entities like &middot;/&rarr; get double-escaped into literal text.
  function measurementsSummary(entry, prevEntry) {
    var parts = [];
    BODY_MEASURE_FIELDS.forEach(function (f) {
      var cur = entry[f.key];
      if (!cur) return;
      var prevVal = prevEntry ? prevEntry[f.key] : '';
      if (prevVal) {
        var diff = Math.round((parseFloat(cur) - parseFloat(prevVal)) * 10) / 10;
        if (diff !== 0) {
          var cls = diff > 0 ? 'is-growth' : 'is-shrink';
          var sign = diff > 0 ? '+' : '';
          parts.push(esc(f.label) + ' ' + esc(prevVal) + 'cm&rarr;' + esc(cur) + 'cm <span class="body-meas-delta ' + cls + '">' + sign + diff + 'cm</span>');
        } else {
          parts.push(esc(f.label) + ' ' + esc(cur) + 'cm <span class="body-meas-delta">&plusmn;0cm</span>');
        }
      } else {
        parts.push(esc(f.label) + ' ' + esc(cur) + 'cm');
      }
    });
    if (!parts.length) return '';
    return parts.join(' &middot; ');
  }

  function measurementsSummaryPlain(entry, prevEntry) {
    var parts = [];
    BODY_MEASURE_FIELDS.forEach(function (f) {
      var cur = entry[f.key];
      if (!cur) return;
      var prevVal = prevEntry ? prevEntry[f.key] : '';
      if (prevVal) {
        var diff = Math.round((parseFloat(cur) - parseFloat(prevVal)) * 10) / 10;
        parts.push(diff !== 0
          ? (f.label + ' ' + prevVal + 'cm->' + cur + 'cm (' + (diff > 0 ? '+' : '') + diff + 'cm)')
          : (f.label + ' ' + cur + 'cm (no change)'));
      } else {
        parts.push(f.label + ' ' + cur + 'cm');
      }
    });
    return parts.join(', ');
  }

  // Small inline-SVG sparkline of weight across your logged weeks, reusing
  // the app's own color tokens rather than a separate chart palette. Empty
  // string when there's fewer than 2 weighed weeks to draw a line between.
  function bodyWeightTrendSvg() {
    var weeks = Object.keys(db.bodyLog)
      .map(function (k) { return parseInt(k, 10); })
      .filter(function (w) { return db.bodyLog[w] && db.bodyLog[w].weight; })
      .sort(function (a, b) { return a - b; });
    if (weeks.length < 2) return '';

    var pts = weeks.map(function (w) { return { week: w, weight: parseFloat(db.bodyLog[w].weight) }; });
    var W = 320, H = 110, padX = 16, padY = 14;
    var minW = Math.min.apply(null, pts.map(function (p) { return p.weight; }));
    var maxW = Math.max.apply(null, pts.map(function (p) { return p.weight; }));
    if (minW === maxW) { minW -= 1; maxW += 1; }
    var minWeek = pts[0].week, maxWeek = pts[pts.length - 1].week;
    var spanWeek = Math.max(1, maxWeek - minWeek);

    function xFor(week) { return padX + (week - minWeek) / spanWeek * (W - padX * 2); }
    function yFor(weight) { return H - padY - (weight - minW) / (maxW - minW) * (H - padY * 2); }

    var pathD = pts.map(function (p, i) {
      return (i === 0 ? 'M' : 'L') + xFor(p.week).toFixed(1) + ',' + yFor(p.weight).toFixed(1);
    }).join(' ');
    var dots = pts.map(function (p) {
      return '<circle cx="' + xFor(p.week).toFixed(1) + '" cy="' + yFor(p.weight).toFixed(1) + '" r="3" fill="var(--accent-strong)"></circle>';
    }).join('');
    var firstLabel = '<text x="' + xFor(pts[0].week).toFixed(1) + '" y="' + (H + 12) + '" class="trend-svg-label" text-anchor="start">Wk' + pts[0].week + '</text>';
    var lastLabel = '<text x="' + xFor(pts[pts.length - 1].week).toFixed(1) + '" y="' + (H + 12) + '" class="trend-svg-label" text-anchor="end">Wk' + pts[pts.length - 1].week + '</text>';
    var maxLabel = '<text x="2" y="' + (yFor(maxW) + 3).toFixed(1) + '" class="trend-svg-label">' + maxW.toFixed(1) + 'kg</text>';
    var minLabel = '<text x="2" y="' + (yFor(minW) + 3).toFixed(1) + '" class="trend-svg-label">' + minW.toFixed(1) + 'kg</text>';

    return '<svg viewBox="0 0 ' + W + ' ' + (H + 16) + '" class="trend-svg" preserveAspectRatio="none" style="width:100%;height:auto;">' +
      '<path d="' + pathD + '" fill="none" stroke="var(--accent-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>' +
      dots + firstLabel + lastLabel + maxLabel + minLabel +
      '</svg>';
  }

  // Bloodwork log — a plain pre/during/post record for your own comparison,
  // with a second optional "during" check for a mid-cycle draw. Deliberately
  // not analyzed or flagged by the app: whether a marker moving up or down
  // is good depends on the marker, and that read is left to you (or your
  // doctor), not this tool. Curated to the markers most worth tracking
  // around a cycle rather than a full lab panel.
  var BLOOD_TIMEPOINTS = [
    { key: 'pre', label: 'Pre-cycle' },
    { key: 'during', label: 'During #1' },
    { key: 'during2', label: 'During #2' },
    { key: 'post', label: 'Post-cycle' }
  ];
  // Matches your lab's own panel structure and reference intervals exactly
  // (as printed on your report), so entering a result is just transcribing.
  // The ref range is shown as plain reference text only — never colored,
  // scored, or flagged. Hormoner has no ref shown since your lab reports
  // those without one; leave blank if yours doesn't give one either.
  var BLOOD_MARKERS = [
    // Hjärt- och kärlmarkörer
    { key: 'totalkolesterol', label: 'Kolesterol (total)', unit: 'mmol/L', ref: '2.9–6.1', cat: 'Hjärt- och kärlmarkörer' },
    { key: 'hdl', label: 'HDL-kolesterol', unit: 'mmol/L', ref: '0.80–2.1', cat: 'Hjärt- och kärlmarkörer' },
    { key: 'ldl', label: 'LDL-kolesterol', unit: 'mmol/L', ref: '1.2–4.3', cat: 'Hjärt- och kärlmarkörer' },
    { key: 'nonhdl', label: 'Non-HDL kolesterol', unit: 'mmol/L', ref: '1.7–5.0', cat: 'Hjärt- och kärlmarkörer' },
    { key: 'triglycerider', label: 'Triglycerider', unit: 'mmol/L', ref: '0.45–2.6', cat: 'Hjärt- och kärlmarkörer' },
    // Blodstatus & B-celler
    { key: 'erytrocyter', label: 'Erytrocyter (EPK)', unit: 'x10¹²/L', ref: '4.2–5.7', cat: 'Blodstatus & B-celler' },
    { key: 'hematokrit', label: 'Hematokrit (EVF)', unit: 'L/L', ref: '0.39–0.50', cat: 'Blodstatus & B-celler' },

  /* ---------- EOD injection timer ----------
     A plain scheduling aid, not medical guidance: you tap Start the moment
     you pin for the first time in a blast, and everything after is counted
     in exact 48h blocks from that instant (not calendar days), so it stays
     synced to your actual pin time regardless of when in the day that was.
     "Slot 0" is the start pin itself (auto-confirmed). Slot N is due at
     startTs + N*48h. If the current slot is past whatever you last
     confirmed, a banner shows on every screen until you tap Injected —
     tapping it always catches you up to the current slot, there's no need
     to confirm every slot individually if you were late. */
  var INJECTION_INTERVAL_MS = 48 * 60 * 60 * 1000;

  function injectionSlotIndex(ts) {
    if (!db.injections.active || !db.injections.startTs) return null;
    return Math.floor((ts - db.injections.startTs) / INJECTION_INTERVAL_MS);
  }

  function injectionDue() {
    if (!db.injections.active) return false;
    var slot = injectionSlotIndex(Date.now());
    return slot !== null && slot > db.injections.lastConfirmedSlot;
  }

  function injectionNextDueAt() {
    if (!db.injections.active) return null;
    return db.injections.startTs + (db.injections.lastConfirmedSlot + 1) * INJECTION_INTERVAL_MS;
  }

  function startInjectionTimer() {
    var now = Date.now();
    db.injections = { active: true, startTs: now, lastConfirmedSlot: 0, history: [{ slot: 0, ts: now }] };
    save();
  }

  function confirmInjection() {
    var slot = injectionSlotIndex(Date.now());
    if (slot === null || slot <= db.injections.lastConfirmedSlot) return;
    db.injections.lastConfirmedSlot = slot;
    db.injections.history.push({ slot: slot, ts: Date.now() });
    save();
  }

  function stopInjectionTimer() {
    db.injections.active = false;
    save();
  }

  // Renders (or hides) the persistent top-of-app banner. Runs on every
  // screen render plus a periodic tick, so it appears the moment a new
  // 48h block starts even if you never leave the screen you're on.
  function renderInjectionBanner() {
    var el = document.getElementById('injection-banner');
    if (!el) return;
    if (!injectionDue()) { el.hidden = true; el.innerHTML = ''; return; }
    var slot = injectionSlotIndex(Date.now());
    el.hidden = false;
    el.innerHTML = '<span class="injection-banner-text">Injection day ' + (slot + 1) + ' &mdash; log it once it\'s done</span>' +
      '<button id="injection-confirm-btn">Injected</button>';
    document.getElementById('injection-confirm-btn').addEventListener('click', function () {
      confirmInjection();
      renderInjectionBanner();
      if (screen === 'blood') renderBlood();
    });
  }

  function findLastLog(exName, beforeDateISO, excludeDayId, excludeDateISO) {
    var best = null;
    Object.keys(db.sessions).forEach(function (key) {
      var s = db.sessions[key];
      if (s.date === excludeDateISO && s.dayId === excludeDayId) return;
      if (s.date >= beforeDateISO) return;
      var log = s.ex[exName];
      if (!log || !log.sets || !log.sets.length) return;
      var hasData = log.sets.some(function (st) { return st.w || st.r; });
      if (!hasData) return;
      if (!best || s.date > best.date) best = { date: s.date, sets: log.sets };
    });
    return best;
  }

  /* Progression guidance, following the program's own day-type rules:
     Heavy = double progression (8 clean reps -> add weight, reset reps),
     Failure/Pump = fixed weight, progress via effort/density, not load. */
  function progressionSuggestion(dayType, last) {
    if (!last) return null;
    var reps = last.sets
      .filter(function (s) { return s.w || s.r; })
      .map(function (s) { return parseInt(s.r, 10); })
      .filter(function (n) { return !isNaN(n); });
    var weights = last.sets
      .filter(function (s) { return s.w; })
      .map(function (s) { return parseFloat(s.w); })
      .filter(function (n) { return !isNaN(n); });
    var top = weights.length ? Math.max.apply(null, weights) : null;
    if (dayType === 'heavy') {
      if (reps.length && reps.every(function (r) { return r >= 8; })) {
        if (top != null) {
          var inc = Math.max(1, Math.round(top * 0.05)); // ~5%, min 1kg
          return 'Hit 8+ reps clean last time at ' + top + 'kg — try ' + (top + inc) + 'kg this session (+' + inc + 'kg) and reset to ~5-6 reps. Round to whatever your equipment actually allows.';
        }
        return 'Hit 8+ reps clean last time — add weight this session and reset to ~5-6 reps.';
      }
      return top != null
        ? ('Work back up to 8 clean reps at ' + top + 'kg before adding load.')
        : 'Work up to 8 clean reps before adding load.';
    }
    if (dayType === 'failure') {
      return top != null
        ? ('Same weight as last time (' + top + 'kg) — progress is fewer forced reps or an extra dropset round, not more weight.')
        : 'Keep weight fixed — progress is fewer forced reps or an extra dropset round.';
    }
    if (dayType === 'pump') {
      return top != null
        ? ('Similar weight to last time (' + top + 'kg) — chase density: same reps with less rest, or a couple more total reps.')
        : 'Keep weight light-moderate — chase density, not load.';
    }
    return 'Maintenance day — keep working weight steady, controlled reps.';
  }

  /* How many consecutive most-recent logged sessions of this exercise (including
     today, if tagged) carry the same pain tag. Used to flag a movement worth
     raising with the coach rather than waiting for a session to actually hurt. */
  function exercisePainStreak(session, exName, tag) {
    var todayLog = session.ex[exName];
    if (!todayLog || (todayLog.painTags || []).indexOf(tag) < 0) return 0;
    var streak = 1;
    var history = Object.keys(db.sessions)
      .map(function (k) { return db.sessions[k]; })
      .filter(function (s) {
        if (s.date === session.date && s.dayId === session.dayId) return false;
        var log = s.ex[exName];
        return log && ((log.sets || []).some(function (st) { return st.w || st.r; }) || (log.painTags || []).length);
      })
      .sort(function (a, b) { return b.date.localeCompare(a.date); });
    for (var i = 0; i < history.length; i++) {
      var tags = history[i].ex[exName].painTags || [];
      if (tags.indexOf(tag) >= 0) streak++; else break;
    }
    return streak;
  }

  /* Per-exercise stall check: splits the last 2 full mesocycles (2 x 49 days)
     into an older half and a recent half, and compares each half's best
     (top weight, then reps at that weight) logged for this exercise. If the
     recent half hasn't beaten the older half, that's the "stalled 2 cycles,
     consider a variation swap" signal from the coach skill's own program-change
     rule — surfaced live instead of only coming up if you ask in chat. Needs
     at least 4 logged instances split across both halves before it'll flag
     anything, so a lift you just started doesn't get flagged prematurely. */
  function exerciseStallInfo(exName) {
    var today = todayISO();
    var windowStart = new Date(today + 'T00:00:00');
    windowStart.setDate(windowStart.getDate() - 98);
    var windowStartISO = windowStart.toISOString().slice(0, 10);
    var mid = new Date(today + 'T00:00:00');
    mid.setDate(mid.getDate() - 49);
    var midISO = mid.toISOString().slice(0, 10);

    var entries = [];
    Object.keys(db.sessions).forEach(function (k) {
      var s = db.sessions[k];
      if (s.date < windowStartISO || s.date > today) return;
      var log = s.ex[exName];
      if (!log || !log.sets) return;
      var weights = log.sets
        .filter(function (st) { return st.w; })
        .map(function (st) { return parseFloat(st.w); })
        .filter(function (n) { return !isNaN(n); });
      if (!weights.length) return;
      var top = Math.max.apply(null, weights);
      var topReps = 0;
      log.sets.forEach(function (st) {
        var w = parseFloat(st.w), r = parseInt(st.r, 10);
        if (w === top && !isNaN(r) && r > topReps) topReps = r;
      });
      entries.push({ date: s.date, top: top, topReps: topReps });
    });
    if (entries.length < 4) return { stalled: false };

    function better(a, b) {
      if (a.top > b.top) return true;
      if (a.top === b.top && a.topReps > b.topReps) return true;
      return false;
    }
    function bestOf(list) {
      return list.reduce(function (best, e) { return (!best || better(e, best)) ? e : best; }, null);
    }

    var older = entries.filter(function (e) { return e.date < midISO; });
    var recent = entries.filter(function (e) { return e.date >= midISO; });
    if (!older.length || !recent.length) return { stalled: false };

    var bestOlder = bestOf(older);
    var bestRecent = bestOf(recent);
    return { stalled: !better(bestRecent, bestOlder), bestOlder: bestOlder, bestRecent: bestRecent };
  }

  function last7Sessions() {
    var today = todayISO();
    var cutoff = new Date(today + 'T00:00:00');
    cutoff.setDate(cutoff.getDate() - 6);
    var cutoffISO = cutoff.toISOString().slice(0, 10);
    return Object.keys(db.sessions)
      .map(function (k) { return db.sessions[k]; })
      .filter(function (s) { return s.date >= cutoffISO && s.date <= today; })
      .filter(function (s) {
        var any = s.sleepEnergy || s.complete || s.skipped;
        if (any) return true;
        return Object.keys(s.ex).some(function (n) {
          var log = s.ex[n];
          return log.note || (log.sets && log.sets.some(function (st) { return st.w || st.r; }));
        });
      })
      .sort(function (a, b) { return a.date.localeCompare(b.date) || a.dayId.localeCompare(b.dayId); });
  }

  function currentWeekRange(dateISO) {
    var d = new Date(dateISO + 'T00:00:00');
    var dow = d.getDay(); // 0=Sun..6=Sat
    var diffToMonday = (dow === 0) ? -6 : (1 - dow);
    var monday = new Date(d); monday.setDate(d.getDate() + diffToMonday);
    var sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    function iso(dt) {
      var m = String(dt.getMonth() + 1).padStart(2, '0');
      var day = String(dt.getDate()).padStart(2, '0');
      return dt.getFullYear() + '-' + m + '-' + day;
    }
    return { start: iso(monday), end: iso(sunday) };
  }

  function volumeTotalsForRange(range) {
    var totals = {};
    Object.keys(VOLUME_TARGETS).forEach(function (m) { totals[m] = 0; });
    Object.keys(db.sessions).forEach(function (k) {
      var s = db.sessions[k];
      if (s.date < range.start || s.date > range.end) return;
      Object.keys(s.ex).forEach(function (name) {
        var muscle = EXERCISE_MUSCLE[name];
        if (!muscle || !(muscle in totals)) return;
        var log = s.ex[name];
        var doneSets = (log.sets || []).filter(function (st) { return st.w || st.r; }).length;
        totals[muscle] += doneSets;
      });
    });
    return totals;
  }

  function weeklyVolumeByMuscle() {
    var range = currentWeekRange(todayISO());
    return { range: range, totals: volumeTotalsForRange(range) };
  }

  // Oldest → newest, weeksBack entries (including the current week last).
  function weeklyVolumeTrend(weeksBack) {
    var today = todayISO();
    var weeks = [];
    for (var i = weeksBack - 1; i >= 0; i--) {
      var d = new Date(today + 'T00:00:00');
      d.setDate(d.getDate() - i * 7);
      var range = currentWeekRange(d.toISOString().slice(0, 10));
      weeks.push({ range: range, totals: volumeTotalsForRange(range) });
    }
    return weeks;
  }

      if (deloadSignal.suggest) {

      }
    }

    [1, 2].forEach(function (wk) {
      var isCurrent = info.started && info.templateWeek === wk;
      html += '<div class="week-heading">Week ' + wk +
        (isCurrent ? ' <span class="now-tag">This week</span>' : '') + '</div>' +
        '<div class="day-grid' + (info.started && !isCurrent ? ' not-current' : '') + '">';
      PROGRAM.filter(function (d) { return d.week === wk; }).forEach(function (d) {
        var done = recentlyDone(d.id);
        var skipped = !done && recentlySkipped(d.id);
        var isToday = isCurrent && d.weekday === todayWeekdayName();
        html += '<button class="day-card' + (isToday ? ' is-today' : '') + '" data-open="' + d.id + '">' +
          (done ? '<span class="done-mark">&#10003;</span>' : (skipped ? '<span class="skip-mark">&ndash;</span>' : '')) +
          '<span class="weekday">' + esc(d.weekday) + (isToday ? '<span class="today-mark">&bull; Today</span>' : '') + '</span>' +
          '<span class="title">' + esc(d.title) + '</span>' +
          '<span class="' + chipClass(d.type) + '">' + esc(d.tag) + '</span>' +
          '</button>';
      });
      html += '</div>';
    });
    if (pushSupported()) {
      html += '<div class="reset-block">' +
        (pushSubscribed
          ? '<div class="reset-hint">Meal and pre-workout notifications are on — you\'ll get a push at each scheduled time, even with the app closed.</div>' +
            '<button class="ghost-btn" id="push-disable-btn" style="color:var(--text-muted)">Turn off notifications</button>'
          : '<div class="reset-hint">Get a push when it\'s time for each meal or your pre-workout shake, even with the app closed.</div>' +
            '<button class="ghost-btn" id="push-enable-btn" style="color:var(--text-muted)">Enable meal &amp; workout notifications</button>') +
        '</div>';
    }
    html += '<div class="reset-block">' +
      '<div class="reset-hint">Starting a fresh cycle? This wipes every logged set, note, checkmark, and diet log, and resets the mesocycle clock to today — nothing is recoverable after. Your personal-record weights (Records tab) are kept, so you still know what to start at.</div>' +
      '<button class="ghost-btn" id="reset-all-btn">Clear all data &amp; start new cycle</button>' +
      '</div>';
    content.innerHTML = html;
    content.querySelectorAll('[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var dayId = btn.getAttribute('data-open');
        setScreen('workout', sessionKey(todayISO(), dayId));
      });
    });

    var editBtn = document.getElementById('meso-edit-btn');
    if (editBtn) {
      editBtn.addEventListener('click', function () {
        mesoEditOpen = true;
        renderHome();
      });
    }
    var saveBtn = document.getElementById('meso-save-btn');
    if (saveBtn) {
      saveBtn.addEventListener('click', function () {
        var val = document.getElementById('meso-date-input').value;
        if (val) { db.mesoStart = val; save(); }
        mesoEditOpen = false;
        renderHome();
        showToast('Cycle start updated');
      });
    }
    var cancelBtn = document.getElementById('meso-cancel-btn');
    if (cancelBtn) {
      cancelBtn.addEventListener('click', function () {
        mesoEditOpen = false;
        renderHome();
      });
    }

    var pushEnableBtn = document.getElementById('push-enable-btn');
    if (pushEnableBtn) pushEnableBtn.addEventListener('click', enablePush);
    var pushDisableBtn = document.getElementById('push-disable-btn');
    if (pushDisableBtn) pushDisableBtn.addEventListener('click', disablePush);

    var resetBtn = document.getElementById('reset-all-btn');
    var confirmingReset = false;
    resetBtn.addEventListener('click', function () {
      if (!confirmingReset) {
        confirmingReset = true;
        resetBtn.textContent = 'Tap again to confirm — clears everything';
        setTimeout(function () {
          confirmingReset = false;
          resetBtn.textContent = 'Clear all data & start new cycle';
        }, 3000);
        return;
      }
      db.sessions = {};
      db.nutrition = {};
      db.mesoStart = todayISO();
      save();
      confirmingReset = false;
      renderHome();
      showToast('All data cleared — cycle clock restarted today');
    });
  }

  /* Patches the Done chip in place without a full re-render, so it appears
     live as you finish typing the last set instead of only after some
     unrelated re-render (quick-fill, pain tag, complete, etc). */
  function updateDoneChip(session, exIdx, name) {
    var card = content.querySelector('.exercise-card[data-ex="' + exIdx + '"]');
    if (!card) return;
    var log = getExLog(session, name);
    var allFilled = log.sets.length > 0 && log.sets.every(function (s) { return s.w !== '' && s.r !== ''; });
    var head = card.querySelector('.exercise-head');
    if (!head) return;
    var chip = head.querySelector('.done-chip');
    if (allFilled && !chip) {
      chip = document.createElement('span');
      chip.className = 'done-chip';
      chip.innerHTML = '&#10003; Done';
      var chevron = head.querySelector('.collapse-chevron');
      head.insertBefore(chip, chevron || null);
    } else if (!allFilled && chip) {
      chip.remove();
    }
  }

  function renderWorkout() {
    var parts = activeKey.split('__');
    var dateISO = parts[0], dayId = parts[1];
    var day = DAY_BY_ID[dayId];
    var session = getSession(dateISO, dayId);
    var scrollPos = content.scrollTop;

    var html = '<div class="session-head">' +
      '<span class="' + chipClass(day.type) + '">' + esc(day.tag) + '</span>' +
      '<div class="title">' + esc(day.title) + '</div>' +
      '<div class="date">' + esc(day.weekday) + ' &middot; ' + esc(dateLabel(dateISO)) + '</div>' +
      '</div>';

    if (session.skipped) {
      html += '<div class="skip-card"><div class="skip-card-label">Skipped</div>' +
        (session.skipReason ? '<div class="skip-card-reason">' + esc(session.skipReason) + '</div>' : '') +
        '<button class="ghost-btn" id="unskip-btn" style="color:var(--text-muted);margin-top:0">Log this day instead</button></div>';
      content.innerHTML = html;
      document.getElementById('unskip-btn').addEventListener('click', function () {
        session.skipped = false;
        session.skipReason = '';
        save();
        renderWorkout();
      });
      content.scrollTop = scrollPos;
      return;
    }

    if (skipFormOpen) {
      html += '<div class="skip-form">' +
        '<label for="skip-reason-input">Why are you skipping this day?</label>' +
        '<textarea id="skip-reason-input" placeholder="e.g. on vacation, rest day, feeling sick"></textarea>' +
        '<div class="skip-form-actions">' +
        '<button id="skip-confirm-btn">Skip this day</button>' +
        '<button class="cancel-link" id="skip-cancel-btn">Cancel</button>' +
        '</div></div>';
    } else {
      html += '<button type="button" class="skip-day-btn" id="skip-day-btn">Skip this day</button>';
    }

    html += '<div class="daylog-card">' +
      '<div class="daylog-field full"><label for="f-sleep">Sleep & energy</label>' +
      '<input id="f-sleep" type="text" placeholder="e.g. slept fine, decent energy" value="' + esc(session.sleepEnergy) + '"></div>' +
      '</div>';

    var mesoInfo = getMesoInfo(dateISO);
    var isDeload = mesoInfo.started && mesoInfo.isDeload;

    day.ex.forEach(function (row, exIdx) {
      var name = row[0], setCount = row[1], target = row[2];
      var log = getExLog(session, name);
      while (log.sets.length < setCount) log.sets.push({ w: '', r: '' });

      var last = findLastLog(name, dateISO, dayId, dateISO);
      var lastHtml = '';
      if (last) {
        var lastStr = last.sets
          .filter(function (s) { return s.w || s.r; })
          .map(function (s) { return (s.w || '–') + '&times;' + (s.r || '–'); })
          .join(', ');
        if (lastStr) lastHtml = '<div class="exercise-last">Last (' + esc(dateLabel(last.date)) + '): ' + lastStr + '</div>';
      }

      var rec = db.records[name];
      var bestHtml = rec ? '<div class="exercise-best">PR: ' + rec.weight + (rec.reps ? '&times;' + rec.reps : '') + ' (' + esc(dateLabel(rec.date)) + ')</div>' : '';

      var suggestion = progressionSuggestion(day.type, last);
      var suggestionHtml = suggestion ? '<div class="exercise-suggestion">' + esc(suggestion) + '</div>' : '';

      var deloadHtml = '';
      if (isDeload) {
        var reduced = Math.max(2, Math.round(setCount * 0.55));
        deloadHtml = '<div class="exercise-deload">Deload week — aim for ~' + reduced + ' sets (down from ' + setCount + '), moderate effort, no dropsets.</div>';
      }

      var stallInfo = exerciseStallInfo(name);
      var stallHtml = stallInfo.stalled
        ? '<div class="exercise-stall">Stalled ~2 cycles — best was ' + stallInfo.bestOlder.top + 'kg x ' + stallInfo.bestOlder.topReps +
          ', still ' + stallInfo.bestRecent.top + 'kg x ' + stallInfo.bestRecent.topReps + '. Worth swapping the variation next mesocycle.</div>'
        : '';

      var quickfillHtml = last ? '<button type="button" class="quickfill-btn" data-ex="' + exIdx + '">Use last time&rsquo;s numbers</button>' : '';
      var restStartHtml = '<button type="button" class="rest-start-btn" data-ex="' + exIdx + '">Start rest (' + fmtSec(restDefaultFor(day.type)) + ')</button>';

      var painTagsHtml = '<div class="pain-tags">' + PAIN_TAGS.map(function (t) {
        var active = log.painTags.indexOf(t) >= 0;
        return '<button type="button" class="pain-tag-btn' + (active ? ' active' : '') + '" data-ex="' + exIdx + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
      }).join('') + '</div>';

      var streakWarnings = PAIN_TAGS.filter(function (t) { return exercisePainStreak(session, name, t) >= 3; });
      var warnHtml = streakWarnings.length
        ? '<div class="exercise-warn">' + streakWarnings.map(function (t) {
            return esc(t) + ' flagged ' + exercisePainStreak(session, name, t) + ' sessions in a row on this movement — worth flagging to your coach or considering a swap / early deload.';
          }).join('<br>') + '</div>'
        : '';

      var allFilled = log.sets.length > 0 && log.sets.every(function (s) { return s.w !== '' && s.r !== ''; });
      var cardKey = sessionKey(dateISO, dayId) + '::' + exIdx;
      var isCollapsed = !!collapsedEx[cardKey];

      html += '<div class="exercise-card type-' + day.type + (isCollapsed ? ' is-collapsed' : '') + '" data-ex="' + exIdx + '">' +
        '<div class="exercise-head" data-ex="' + exIdx + '">' +
        '<span class="exercise-name">' + esc(name) + '</span>' +
        (allFilled ? '<span class="done-chip">&#10003; Done</span>' : '') +
        '<span class="collapse-chevron">' + (isCollapsed ? '&#9656;' : '&#9662;') + '</span>' +
        '</div>' +
        (target ? '<div class="exercise-target">' + esc(target) + '</div>' : '') +
        lastHtml +
        bestHtml +
        suggestionHtml +
        deloadHtml +
        stallHtml +
        warnHtml +
        '<div class="set-labels"><span>#</span><span>Weight</span><span>Reps</span></div>' +
        '<div class="set-rows">' +
        log.sets.map(function (s, i) {
          return '<div class="set-row">' +
            '<span class="set-idx">' + (i + 1) + '</span>' +
            '<div class="stepper">' +
            '<button type="button" class="step-btn" data-ex="' + exIdx + '" data-set="' + i + '" data-field="w" data-dir="-1">&minus;</button>' +
            '<input type="number" inputmode="decimal" placeholder="kg" data-ex="' + exIdx + '" data-set="' + i + '" data-field="w" value="' + esc(s.w) + '">' +
            '<button type="button" class="step-btn" data-ex="' + exIdx + '" data-set="' + i + '" data-field="w" data-dir="1">+</button>' +
            '</div>' +
            '<div class="stepper">' +
            '<button type="button" class="step-btn" data-ex="' + exIdx + '" data-set="' + i + '" data-field="r" data-dir="-1">&minus;</button>' +
            '<input type="number" inputmode="numeric" placeholder="reps" data-ex="' + exIdx + '" data-set="' + i + '" data-field="r" value="' + esc(s.r) + '">' +
            '<button type="button" class="step-btn" data-ex="' + exIdx + '" data-set="' + i + '" data-field="r" data-dir="1">+</button>' +
            '</div>' +
            '</div>';
        }).join('') +
        '</div>' +
        '<div class="exercise-actions">' + quickfillHtml + restStartHtml + '</div>' +
        painTagsHtml +
        '<div class="exercise-note"><label for="note-' + exIdx + '">Notes (effort, joints, form)</label>' +
        '<textarea id="note-' + exIdx + '" data-ex="' + exIdx + '" data-field="note" placeholder="e.g. hit 8 clean, elbow felt fine">' + esc(log.note) + '</textarea></div>' +
        '</div>';
    });

    html += '<button class="primary-btn' + (session.complete ? ' is-done' : '') + '" id="complete-btn">' +
      (session.complete ? '&#10003; Day complete — tap to reopen' : 'Mark day complete') + '</button>';
    html += '<button class="ghost-btn" id="clear-btn">Clear this session</button>';

    content.innerHTML = html;

    document.getElementById('f-sleep').addEventListener('input', function (e) {
      session.sleepEnergy = e.target.value; save();
    });

    content.querySelectorAll('input[data-ex]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var exIdx = Number(inp.getAttribute('data-ex'));
        var setIdx = Number(inp.getAttribute('data-set'));
        var field = inp.getAttribute('data-field');
        var name = day.ex[exIdx][0];
        var log = getExLog(session, name);
        log.sets[setIdx][field] = inp.value;
        maybePrToast(maybeUpdateRecord(name, log.sets[setIdx].w, log.sets[setIdx].r, dateISO), name);
        updateDoneChip(session, exIdx, name);
        save();
      });
    });
    content.querySelectorAll('textarea[data-ex]').forEach(function (ta) {
      ta.addEventListener('input', function () {
        var exIdx = Number(ta.getAttribute('data-ex'));
        var name = day.ex[exIdx][0];
        var log = getExLog(session, name);
        log.note = ta.value;
        save();
      });
    });

    content.querySelectorAll('.step-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var exIdx = Number(btn.getAttribute('data-ex'));
        var setIdx = Number(btn.getAttribute('data-set'));
        var field = btn.getAttribute('data-field');
        var dir = Number(btn.getAttribute('data-dir'));
        var name = day.ex[exIdx][0];
        var log = getExLog(session, name);
        var step = field === 'w' ? 2.5 : 1;
        var cur = parseFloat(log.sets[setIdx][field]);
        if (isNaN(cur)) cur = 0;
        var next = Math.round((cur + dir * step) * 100) / 100;
        if (next < 0) next = 0;
        log.sets[setIdx][field] = String(next);
        var inp = content.querySelector('input[data-ex="' + exIdx + '"][data-set="' + setIdx + '"][data-field="' + field + '"]');
        if (inp) inp.value = next;
        maybePrToast(maybeUpdateRecord(name, log.sets[setIdx].w, log.sets[setIdx].r, dateISO), name);
        updateDoneChip(session, exIdx, name);
        save();
      });
    });

    content.querySelectorAll('.quickfill-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var exIdx = Number(btn.getAttribute('data-ex'));
        var name = day.ex[exIdx][0];
        var log = getExLog(session, name);
        var last = findLastLog(name, dateISO, dayId, dateISO);
        if (!last) return;
        for (var i = 0; i < log.sets.length && i < last.sets.length; i++) {
          if (!log.sets[i].w && last.sets[i].w) log.sets[i].w = last.sets[i].w;
          if (!log.sets[i].r && last.sets[i].r) log.sets[i].r = last.sets[i].r;
          maybeUpdateRecord(name, log.sets[i].w, log.sets[i].r, dateISO);
        }
        save();
        renderWorkout();
        showToast('Filled from last session');
      });
    });

    content.querySelectorAll('.rest-start-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var exIdx = Number(btn.getAttribute('data-ex'));
        var name = day.ex[exIdx][0];
        startRest(restDefaultFor(day.type), name);
      });
    });

    content.querySelectorAll('.pain-tag-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var exIdx = Number(btn.getAttribute('data-ex'));
        var tag = btn.getAttribute('data-tag');
        var name = day.ex[exIdx][0];
        var log = getExLog(session, name);
        var idx = log.painTags.indexOf(tag);
        if (idx >= 0) log.painTags.splice(idx, 1); else log.painTags.push(tag);
        save();
        renderWorkout();
      });
    });

    content.querySelectorAll('.exercise-head').forEach(function (head) {
      head.addEventListener('click', function () {
        var exIdx = head.getAttribute('data-ex');
        var key = sessionKey(dateISO, dayId) + '::' + exIdx;
        collapsedEx[key] = !collapsedEx[key];
        var card = head.closest('.exercise-card');
        if (card) card.classList.toggle('is-collapsed', collapsedEx[key]);
        var chevron = head.querySelector('.collapse-chevron');
        if (chevron) chevron.innerHTML = collapsedEx[key] ? '&#9656;' : '&#9662;';
      });
    });

    content.scrollTop = scrollPos;

    document.getElementById('complete-btn').addEventListener('click', function () {
      session.complete = !session.complete;
      save();
      renderWorkout();
    });

    var skipBtn = document.getElementById('skip-day-btn');
    if (skipBtn) {
      skipBtn.addEventListener('click', function () {
        skipFormOpen = true;
        renderWorkout();
      });
    }
    var skipCancelBtn = document.getElementById('skip-cancel-btn');
    if (skipCancelBtn) {
      skipCancelBtn.addEventListener('click', function () {
        skipFormOpen = false;
        renderWorkout();
      });
    }
    var skipConfirmBtn = document.getElementById('skip-confirm-btn');
    if (skipConfirmBtn) {
      skipConfirmBtn.addEventListener('click', function () {
        var reasonInp = document.getElementById('skip-reason-input');
        session.skipped = true;
        session.skipReason = reasonInp ? reasonInp.value : '';
        skipFormOpen = false;
        save();
        renderWorkout();
        showToast('Day marked skipped');
      });
    }

    var clearBtn = document.getElementById('clear-btn');
    var confirming = false;
    clearBtn.addEventListener('click', function () {
      if (!confirming) {
        confirming = true;
        clearBtn.textContent = 'Tap again to confirm clear';
        setTimeout(function () { confirming = false; clearBtn.textContent = 'Clear this session'; }, 3000);
        return;
      }
      delete db.sessions[sessionKey(dateISO, dayId)];
      save();
      setScreen('home');
    });
  }

  function buildSummaryText() {
    var sessions = last7Sessions();
    var nutriDaysEarly = last7NutritionDays();
    var latestBody = latestBodyEntry();
    if (!sessions.length && !nutriDaysEarly.length && !latestBody) return '';
    var lines = [];
    if (sessions.length) {
      lines.push('Weekly training log — ' + dateLabel(sessions[0].date) + ' to ' + dateLabel(sessions[sessions.length - 1].date));
    } else if (nutriDaysEarly.length) {
      lines.push('Weekly log — ' + dateLabel(nutriDaysEarly[0]) + ' to ' + dateLabel(nutriDaysEarly[nutriDaysEarly.length - 1]) + ' (no training logged this week)');
    } else {
      lines.push('Weekly log — ' + dateLabel(todayISO()) + ' (no training or nutrition logged this week)');
    }
    var info = getMesoInfo(todayISO());
    if (info.started) {
      lines.push('Mesocycle ' + info.mesoNumber + ', ' + info.cycleLabel + ', Program Week ' + info.templateWeek + ' (Day ' + info.dayNumber + ' of the mesocycle)');
    }
    lines.push('');
    sessions.forEach(function (s) {
      var day = DAY_BY_ID[s.dayId];
      var statusTag = s.skipped ? ' [skipped' + (s.skipReason ? ' — ' + s.skipReason : '') + ']' : (s.complete ? ' [complete]' : ' [in progress]');
      lines.push('== ' + day.weekday + ' ' + dateLabel(s.date) + ' — ' + day.title + ' (' + day.tag + ')' + statusTag + ' ==');
      if (s.skipped) { lines.push(''); return; }
      if (s.sleepEnergy) lines.push('Sleep/energy: ' + s.sleepEnergy);
      day.ex.forEach(function (row) {
        var name = row[0];
        var log = s.ex[name];
        if (!log) return;
        var setStr = (log.sets || [])
          .filter(function (st) { return st.w || st.r; })
          .map(function (st) { return (st.w || '–') + 'x' + (st.r || '–'); })
          .join(', ');
        if (!setStr && !log.note) return;
        var prevStr = '';
        var last = findLastLog(name, s.date, s.dayId, s.date);
        if (last) {
          var ls = last.sets
            .filter(function (st) { return st.w || st.r; })
            .map(function (st) { return (st.w || '–') + 'x' + (st.r || '–'); })
            .join(', ');
          if (ls) prevStr = '  [prev ' + dateLabel(last.date) + ': ' + ls + ']';
        }
        lines.push('- ' + name + (setStr ? ': ' + setStr : '') + prevStr + (log.note ? '  // ' + log.note : ''));
      });
      lines.push('');
    });

    if (nutriDaysEarly.length) {
      lines.push('== Nutrition (last 7 days) ==');
      nutriDaysEarly.forEach(function (d) {
        var log = db.nutrition[d];
        var dayMeals = mealsForDate(d);
        var eaten = dayMeals.filter(function (m) { return !!log.meals[m.id]; }).length;
        var totals = nutritionTotals(log, d);
        var summaryStr = totals.kcal
          ? (Math.round(totals.kcal) + ' kcal, ' + Math.round(totals.protein) + 'g protein, ' + Math.round(totals.carbs) + 'g carbs, ' + Math.round(totals.fat) + 'g fat')
          : 'no macros logged';
        if (log.meals[STALL_MEAL.id]) summaryStr += ' [+stall-breaker shake]';
        lines.push('- ' + dateLabel(d) + ': ' + eaten + '/' + dayMeals.length + ' meals — ' + summaryStr);
      });
      lines.push('');
    }

    if (latestBody) {
      lines.push('== Body composition — Week ' + latestBody.week + ' ==');
      var bits = [];
      if (latestBody.entry.weight) {
        var w = latestBody.entry.weight + 'kg';
        if (latestBody.prevEntry && latestBody.prevEntry.weight) {
          var diff = Math.round((parseFloat(latestBody.entry.weight) - parseFloat(latestBody.prevEntry.weight)) * 10) / 10;
          w = latestBody.prevEntry.weight + 'kg->' + latestBody.entry.weight + 'kg (' + (diff > 0 ? '+' : '') + diff + 'kg vs week ' + latestBody.prevWeek + ')';
        }
        bits.push(w);
      }
      var meas = measurementsSummaryPlain(latestBody.entry, latestBody.prevEntry);
      if (meas) bits.push(meas);
      lines.push(bits.length ? bits.join(' — ') : 'no numbers logged');
      lines.push('');
    }

    return lines.join('\n').trim();
  }

  function hasNutritionData(log) {
    if (!log) return false;
    var anyMeal = Object.keys(log.meals || {}).some(function (k) { return log.meals[k]; });
    return anyMeal || !!log.protein || !!log.carbs || !!log.fat;
  }

  function last7NutritionDays() {
    var today = todayISO();
    var cutoff = new Date(today + 'T00:00:00');
    cutoff.setDate(cutoff.getDate() - 6);
    var cutoffISO = cutoff.toISOString().slice(0, 10);
    return Object.keys(db.nutrition)
      .filter(function (d) { return d >= cutoffISO && d <= today && hasNutritionData(db.nutrition[d]); })
      .sort();
  }

  function macroBarHtml(label, curVal, target, unit) {
    var cur = parseFloat(curVal) || 0;
    var pct = target ? Math.max(0, Math.min(100, Math.round((cur / target) * 100))) : 0;
    return '<div class="volume-row">' +
      '<span class="volume-label">' + esc(label) + '</span>' +
      '<div class="volume-bar"><div class="volume-fill' + (cur >= target ? ' is-met' : '') + '" style="width:' + pct + '%"></div></div>' +
      '<span class="volume-count">' + Math.round(cur) + unit + '/' + target + unit + '</span>' +
      '</div>';
  }

  /* Sum of the checked-off meals' own macros — these are the user's real
     figures for their actual brands, not estimated by the app. */
  function mealAutoTotals(log, dateISO) {
    var t = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
    // Include the stall-breaker shake in the concat regardless of whether
    // it's stalled right now, so a day's totals stay correct even if you
    // check it off and the stall condition happens to clear later that day.
    mealsForDate(dateISO).concat([STALL_MEAL]).forEach(function (m) {
      if (!log.meals[m.id]) return;
      t.kcal += m.macros.kcal; t.protein += m.macros.protein;
      t.carbs += m.macros.carbs; t.fat += m.macros.fat;
    });
    return t;
  }
  /* Auto meal totals plus whatever the user manually adds for anything
     outside the plan (a snack, a drink, etc). */
  function bonusKcal(log) {
    var p = parseFloat(log.protein) || 0, c = parseFloat(log.carbs) || 0, f = parseFloat(log.fat) || 0;
    return p * 4 + c * 4 + f * 9;
  }
  function nutritionTotals(log, dateISO) {
    var auto = mealAutoTotals(log, dateISO);
    return {
      kcal: auto.kcal + bonusKcal(log),
      protein: auto.protein + (parseFloat(log.protein) || 0),
      carbs: auto.carbs + (parseFloat(log.carbs) || 0),
      fat: auto.fat + (parseFloat(log.fat) || 0)
    };
  }

    html += '<div class="volume-card"><div class="volume-head">Today&rsquo;s totals vs. your plan&rsquo;s macro targets</div>' +

      macroBarHtml('Protein', totals.protein, targets.protein, 'g') +

    html += '<div class="week-heading">Extra / not in the plan</div>';
    html += '<div class="daylog-card">' +
      '<div class="daylog-field full"><label>Calories (auto)</label>' +

      '<div class="daylog-field"><label for="n-protein">Protein (g)</label>' +
      '<input id="n-protein" type="number" inputmode="decimal" placeholder="0" value="' + esc(log.protein) + '"></div>' +

    html += '<div class="week-heading">Meals &middot; ' + eatenCount + '/' + todaysMeals.length + ' logged today' + (isWeekendISO(dateISO) ? ' &mdash; weekend plan' : '') + '</div>';
    todaysMeals.forEach(function (m) {
      var eaten = !!log.meals[m.id];
      html += '<button type="button" class="meal-card' + (eaten ? ' is-eaten' : '') + '" data-meal="' + m.id + '">' +
        '<div class="meal-row-top"><span class="meal-time">' + esc(m.time) + '</span>' +
        '<span class="meal-check">' + (eaten ? '&#10003; Eaten' : 'Mark eaten') + '</span></div>' +
        '<div class="meal-name">' + esc(m.name) + '</div>' +
        '<div class="meal-items">' + m.items.map(esc).join(' &middot; ') + '</div>' +
        '<div class="meal-macros">' + m.macros.kcal + ' kcal &middot; ' + m.macros.protein + 'g P &middot; ' + m.macros.carbs + 'g C &middot; ' + m.macros.fat + 'g F</div>' +
        '</button>';
      // Stall-breaker slots in right after the during-gym carb shake, only
      // on days the stall condition is active.
      if (m.id === 'm4' && targets.stalled) {
        var stallEaten = !!log.meals[STALL_MEAL.id];
        html += '<button type="button" class="meal-card is-stall' + (stallEaten ? ' is-eaten' : '') + '" data-meal="' + STALL_MEAL.id + '">' +
          '<div class="meal-row-top"><span class="stall-badge">Stall breaker</span>' +

  }

    content.innerHTML = html;

    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        var t = text;
        var done = function () { showToast('Copied'); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(done).catch(function () { fallbackCopy(t, done); });
        } else {
          fallbackCopy(t, done);
        }
      });
    }
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* clipboard unavailable */ }
    document.body.removeChild(ta);
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600);

  /* ================= Rest timer =================
     Lives outside #content so it survives screen re-renders and keeps
     counting while you fill in the next set or check another tab. */
  var REST_DEFAULTS = { heavy: 150, failure: 90, pump: 60, moderate: 90 };
  var restState = null; // { remaining, total, label, paused }
  var restIntervalId = null;

  function restDefaultFor(dayType) { return REST_DEFAULTS[dayType] || 90; }

  function startRest(seconds, label) {
    if (restIntervalId) { clearInterval(restIntervalId); restIntervalId = null; }
    // endsAt is an absolute wall-clock target, not a countdown counter — see
    // tickRest() for why that's what makes this survive a backgrounded tab.
    restState = { endsAt: Date.now() + seconds * 1000, total: seconds, label: label, paused: false, pausedMs: 0, doneFired: false };
    restIntervalId = setInterval(tickRest, 1000);
    renderRestBar();
    pushRestSchedule(seconds, label);
  }

  // Remaining time is always re-derived from endsAt vs. the current clock,
  // never decremented tick-by-tick. Phones throttle or fully suspend
  // setInterval once a tab/PWA is backgrounded or the screen locks, so a
  // counter that subtracts 1 per "tick" silently falls behind — this can't,
  // because whenever it's actually asked to run again (even minutes late)
  // it recomputes from real elapsed time instead of assuming ticks happened.
  function tickRest() {
    if (!restState || restState.paused) return;
    var remainingMs = restState.endsAt - Date.now();
    if (remainingMs <= 0) {
      if (restIntervalId) { clearInterval(restIntervalId); restIntervalId = null; }
      if (!restState.doneFired) {
        restState.doneFired = true;
        try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* vibration unsupported */ }
        showToast('Rest done' + (restState.label ? ' — ' + restState.label : ''));
        pushRestCancel(); // already handled locally — don't also let a stray background push arrive
        setTimeout(function () {
          if (restState && restState.endsAt - Date.now() <= 0) { restState = null; renderRestBar(); }
        }, 5000);
      }
      renderRestBar();
      return;
    }
    renderRestBar();
  }

  function restRemainingSec() {
    if (!restState) return 0;
    var ms = restState.paused ? restState.pausedMs : (restState.endsAt - Date.now());
    return Math.max(0, Math.ceil(ms / 1000));
  }

  function renderRestBar() {
    var bar = document.getElementById('rest-bar');
    if (!restState) { bar.hidden = true; bar.innerHTML = ''; return; }
    var remaining = restRemainingSec();
    bar.hidden = false;
    bar.classList.toggle('is-done', remaining <= 0);
    var timeStr = (remaining <= 0) ? 'Done' : fmtSec(remaining);
    bar.innerHTML =
      '<span class="rest-time">' + timeStr + '</span>' +
      '<span class="rest-label">' + esc(restState.label || 'Resting') + '</span>' +
      (remaining > 0 ? '<button id="rest-pause-btn">' + (restState.paused ? 'Resume' : 'Pause') + '</button>' : '') +
      (remaining > 0 ? '<button id="rest-plus-btn">+30s</button>' : '') +
      '<button id="rest-dismiss-btn">' + (remaining > 0 ? 'Skip' : 'Dismiss') + '</button>';
    var pauseBtn = document.getElementById('rest-pause-btn');
    if (pauseBtn) {
      pauseBtn.addEventListener('click', function () {
        if (restState.paused) {
          restState.endsAt = Date.now() + restState.pausedMs;
          restState.paused = false;
          if (!restIntervalId) restIntervalId = setInterval(tickRest, 1000);
          pushRestSchedule(Math.round(restState.pausedMs / 1000), restState.label);
        } else {
          restState.pausedMs = Math.max(0, restState.endsAt - Date.now());
          restState.paused = true;
          pushRestCancel(); // don't fire a background push for time that isn't actually elapsing
        }
        renderRestBar();
      });
    }
    var plusBtn = document.getElementById('rest-plus-btn');
    if (plusBtn) {
      plusBtn.addEventListener('click', function () {
        if (restState.paused) {
          restState.pausedMs += 30000; // reschedule happens on Resume, not here
        } else {
          restState.endsAt += 30000;
          pushRestSchedule(restRemainingSec(), restState.label);
        }
        restState.total += 30;
        renderRestBar();
      });
    }
    document.getElementById('rest-dismiss-btn').addEventListener('click', function () {
      if (restIntervalId) { clearInterval(restIntervalId); restIntervalId = null; }
      restState = null;
      pushRestCancel();
      renderRestBar();
    });
  }

  // Whenever the tab/app comes back to the foreground, force an immediate
  // resync instead of waiting for the next 1s tick — this is what makes the
  // timer show the correct value right away rather than a stale one from
  // before you switched away, even if the interval itself got suspended.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { tickRest(); renderInjectionBanner(); }
  });
  window.addEventListener('focus', function () { tickRest(); renderInjectionBanner(); });
  window.addEventListener('pageshow', function () { tickRest(); renderInjectionBanner(); });
  // Catches the exact moment a new 48h block starts while the app just
  // sits open on a screen you're not navigating away from.
  setInterval(renderInjectionBanner, 60 * 1000);

  backBtn.addEventListener('click', function () { setScreen('home'); });
  tabHome.addEventListener('click', function () { setScreen('home'); });
  tabSummary.addEventListener('click', function () { setScreen('summary'); });
  tabRecords.addEventListener('click', function () { setScreen('records'); });
  tabDiet.addEventListener('click', function () { setScreen('diet'); });
  tabBody.addEventListener('click', function () { setScreen('body'); });
  tabBlood.addEventListener('click', function () { setScreen('blood'); });

  render();
})();
</script>
